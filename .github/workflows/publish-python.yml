# Publishes the `imho` package to PyPI with Trusted Publishing (OIDC, no API token).
#
# Trigger: push a tag `python-v<version>` that matches python/src/imho/_version.py,
# e.g. `git tag python-v0.1.0 && git push origin python-v0.1.0`.
#
# One-time setup on pypi.org (see README "Publishing the Python package"):
# a pending publisher for project `imho`, owner `0x216`, repository `imho-mcp`,
# workflow `publish-python.yml`, environment `pypi`.

name: Publish Python package

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches package version
        run: |
          version=$(python3 -c "import re;print(re.search(r'\"(.+)\"', open('src/imho/_version.py').read()).group(1))")
          test "python-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != python-v${version}"; exit 1; }
      - name: Tests
        run: uv run --isolated --python 3.13 --with pytest --with pytest-asyncio --with-editable . pytest -q
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/imho/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
