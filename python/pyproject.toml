[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "imho"
dynamic = ["version"]
description = "Python client for the imho.run API: Steam games like any game, game facts, and finding a game from a description."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "imho.run", email = "admin@imho.run" }]
keywords = ["steam", "games", "game-recommendations", "recommender-system", "mcp", "imho"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://imho.run/developers"
Documentation = "https://github.com/0x216/imho-mcp/tree/main/python#readme"
Repository = "https://github.com/0x216/imho-mcp"
Issues = "https://github.com/0x216/imho-mcp/issues"

[tool.hatch.version]
path = "src/imho/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/imho"]

[tool.hatch.build.targets.sdist]
include = ["src/imho", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real imho.run API (set IMHO_LIVE=1)"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
